name: Smoke test (production)

# Jonli saytni kuzatadi — bugungidek "jimgina buzilish"ni avtomatik ushlaydi.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *' # har soatda
  workflow_dispatch: {} # qo'lda ishga tushirish

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deploy'ini kutish (faqat push'da)
        if: github.event_name == 'push'
        run: sleep 120

      - name: Production endpointlarni tekshirish
        run: |
          fail=0
          check() {
            name="$1"; url="$2"; expect="$3"
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$url")
            if [ "$code" = "$expect" ]; then
              echo "✅ $name: $code"
            else
              echo "❌ $name: $code (kutilgan $expect) — $url"
              fail=1
            fi
          }

          check "web zyff.uz"     "https://zyff.uz/"                  "200"
          check "backend health"  "https://libos-api.vercel.app/health" "200"
          check "www -> zyff.uz"   "https://www.zyff.uz/"             "308"

          # Sitemap mahsulotlarni o'z ichiga oladimi? (web -> backend -> DB zanjiri)
          # Ogohlantirish sifatida — do'konlarda vaqtincha sotuvda mahsulot bo'lmasligi
          # (masalan katalog tozalanganda) me'yoriy holat, bu boshqa tekshiruvlarni
          # to'xtatmasligi kerak.
          sm=$(curl -sL -m 30 "https://zyff.uz/sitemap.xml")
          if echo "$sm" | grep -q "/product/"; then
            count=$(echo "$sm" | grep -c "/product/")
            echo "✅ sitemap: $count ta mahsulot URL"
          else
            echo "⚠️ sitemap'da mahsulot YO'Q — do'konlarda sotuvda mahsulot yo'q bo'lishi mumkin (yoki data qatlami buzilgan, NEXT_PUBLIC_API_URL?)"
          fi

          exit $fail
